openapi: 3.0.3
info:
  title: Transaction Ledger API
  version: 1.0.0
  contact:
    name: Anshaj — Full Stack Developer Assessment for Confluencr
  description: |
    Built by **Anshaj** as the Full Stack Developer Assessment for **Confluencr**.

    Accounts with an append-only ledger of credit/debit transactions, plus atomic
    account-to-account transfers.

    **Conventions**
    - All endpoints are under `/api`. Request and response bodies are JSON.
    - Successful responses wrap the payload in `data`; list endpoints add `pagination`.
    - Every error has the same shape: `{ "error": { "code", "message", "details?" } }`.
    - Amounts are decimals with at most 2 decimal places, sent as a JSON number
      (`50`, `19.99`) or numeric string (`"19.99"`), and returned as JSON numbers.
    - Ids are UUIDs. Timestamps are ISO-8601 UTC strings generated by the server.
    - Transactions are immutable: there are no update or delete operations, and
      `PUT`/`PATCH`/`DELETE` return `405 METHOD_NOT_ALLOWED`.
servers:
  - url: http://localhost:4000
tags:
  - name: Accounts
  - name: Transactions
  - name: Transfers
paths:
  /api/accounts:
    post:
      tags: [Accounts]
      summary: Create an account
      description: Creates an account with a balance of 0. The client cannot set `id`, `balance` or `created_at`; sending any field other than `name` is a validation error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255, example: Alice }
      responses:
        '201':
          description: Account created
          headers:
            Location: { schema: { type: string }, description: URL of the new account }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Accounts]
      summary: List accounts
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Account' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/InvalidPagination' }

  /api/accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get an account
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/InvalidAccountId' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      summary: Get an account's current balance
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      account_id: { type: string, format: uuid }
                      balance: { type: number, example: 100 }
        '400': { $ref: '#/components/responses/InvalidAccountId' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/accounts/{accountId}/transactions:
    post:
      tags: [Transactions]
      summary: Add a credit or debit transaction
      description: |
        Records the transaction and updates the balance in one atomic database
        transaction. `reference_id` is an idempotency key unique per account:
        resubmitting it returns `409 DUPLICATE_TRANSACTION` (with the original
        transaction in `details.transaction`) and changes nothing. The same
        `reference_id` may be used on different accounts.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTransaction' }
            examples:
              credit:
                value: { type: credit, amount: 100, description: Salary, reference_id: salary-2026-10 }
              debit:
                value: { type: debit, amount: 30, description: Groceries, reference_id: pos-88123 }
      responses:
        '201':
          description: Transaction created
          headers:
            Location: { schema: { type: string }, description: URL of the new transaction }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transaction: { $ref: '#/components/schemas/Transaction' }
                      balance: { type: number, description: Account balance after this transaction, example: 150 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/DuplicateTransaction' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }
    get:
      tags: [Transactions]
      summary: Transaction history
      description: Latest first (by `created_at`), optionally filtered by type.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: type
          in: query
          required: false
          description: Omit to return both credits and debits.
          schema: { type: string, enum: [credit, debit] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400':
          description: Invalid account id, `type` filter or pagination parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                pagination:
                  value: { error: { code: INVALID_PAGINATION, message: 'limit: limit must be at most 100', details: [{ field: limit, message: limit must be at most 100 }] } }
                type:
                  value: { error: { code: VALIDATION_ERROR, message: "type: must be either 'credit' or 'debit'", details: [{ field: type, message: "must be either 'credit' or 'debit'" }] } }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Get a single transaction
      description: Read-only. `PUT`, `PATCH` and `DELETE` return `405` because transactions are immutable.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: Malformed transaction id
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: Transaction not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/summary:
    get:
      tags: [Accounts]
      summary: Ledger-wide totals (used by the dashboard)
      responses:
        '200':
          description: Totals across all accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accounts: { type: integer, example: 7 }
                      total_balance: { type: number, example: 1284500.5 }
                      transactions: { type: integer, example: 312 }
                      transfers: { type: integer, example: 9 }

  /api/transfers:
    post:
      tags: [Transfers]
      summary: Transfer money between accounts (bonus)
      description: |
        Debits the source and credits the destination atomically. The transfer
        record, both ledger entries and both balance updates are committed in a
        single database transaction, so a partial transfer is impossible.
        Each leg appears in its account's history with `transfer_id` set and
        `reference_id` = `transfer:<transfer id>`. The request `reference_id` is
        unique per source account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTransfer' }
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/Transfer' }
                      debit_transaction: { $ref: '#/components/schemas/Transaction' }
                      credit_transaction: { $ref: '#/components/schemas/Transaction' }
                      from_account: { $ref: '#/components/schemas/Balance' }
                      to_account: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/DuplicateTransaction' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }

  schemas:
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Alice }
        balance: { type: number, example: 0 }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        balance: { type: number }
    NewTransaction:
      type: object
      additionalProperties: false
      required: [type, amount, reference_id]
      properties:
        type: { type: string, enum: [credit, debit] }
        amount:
          oneOf: [{ type: number }, { type: string }]
          description: Greater than 0, at most 2 decimal places, at most 9999999999999.99
          example: 50
        description: { type: string, maxLength: 500, default: '' }
        reference_id: { type: string, minLength: 1, maxLength: 100, description: Unique per account (idempotency key) }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount: { type: number, example: 50 }
        description: { type: string }
        reference_id: { type: string }
        transfer_id: { type: string, format: uuid, nullable: true, description: Set when the entry is one leg of a transfer }
        created_at: { type: string, format: date-time }
    NewTransfer:
      type: object
      additionalProperties: false
      required: [from_account_id, to_account_id, amount, reference_id]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid, description: Must differ from from_account_id }
        amount: { oneOf: [{ type: number }, { type: string }], example: 30 }
        description: { type: string, maxLength: 500, default: '' }
        reference_id: { type: string, minLength: 1, maxLength: 100, description: Unique per source account }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount: { type: number }
        description: { type: string }
        reference_id: { type: string }
        created_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1, description: Current page }
        limit: { type: integer, example: 10, description: Page size }
        total_records: { type: integer, example: 42 }
        total_pages: { type: integer, example: 5 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - INVALID_PAGINATION
                - INVALID_ACCOUNT_ID
                - INVALID_TRANSACTION_ID
                - ACCOUNT_NOT_FOUND
                - TRANSACTION_NOT_FOUND
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - DUPLICATE_TRANSACTION
                - INSUFFICIENT_BALANCE
                - AMOUNT_OUT_OF_RANGE
                - PAYLOAD_TOO_LARGE
                - INTERNAL_ERROR
            message: { type: string }
            details: { description: Optional structured context (field errors, the existing transaction, ...) }

  responses:
    ValidationError:
      description: Invalid request body (missing/unknown fields, bad type, bad amount, malformed JSON)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            amount:
              value: { error: { code: VALIDATION_ERROR, message: 'amount: must be greater than 0', details: [{ field: amount, message: must be greater than 0 }] } }
            type:
              value: { error: { code: VALIDATION_ERROR, message: "type: must be either 'credit' or 'debit'", details: [{ field: type, message: "must be either 'credit' or 'debit'" }] } }
            balanceNotAllowed:
              value: { error: { code: VALIDATION_ERROR, message: "Unrecognized key(s) in object: 'balance'", details: [{ field: null, message: "Unrecognized key(s) in object: 'balance'" }] } }
            json:
              value: { error: { code: INVALID_JSON, message: Request body is not valid JSON } }
    InvalidPagination:
      description: page/limit are not positive integers, or limit > 100
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_PAGINATION, message: 'page: page must be at least 1', details: [{ field: page, message: page must be at least 1 }] } }
    InvalidAccountId:
      description: The account id is not a UUID
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INVALID_ACCOUNT_ID, message: "'abc' is not a valid account id (expected a UUID)" } }
    AccountNotFound:
      description: No account with that id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: ACCOUNT_NOT_FOUND, message: "Account '4b7c...' was not found", details: { account_id: 4b7c... } } }
    DuplicateTransaction:
      description: reference_id already used for this account; nothing was created and the balance is unchanged
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: DUPLICATE_TRANSACTION, message: "A transaction with reference_id 'pos-88123' already exists for this account", details: { transaction: { id: '...', type: debit, amount: 30 } } } }
    InsufficientBalance:
      description: Debit exceeds the current balance; nothing was changed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: INSUFFICIENT_BALANCE, message: 'Insufficient balance: account has 100.00, debit requires 150.00', details: { account_id: '...', balance: 100, requested_amount: 150 } } }
    MethodNotAllowed:
      description: Transactions cannot be modified or deleted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: METHOD_NOT_ALLOWED, message: 'DELETE is not allowed on this resource. Allowed: GET' } }
